# ui-service 的 Nginx 配置（容器/生产用）
# 本地无 Docker 时由 server.mjs 承担同样职责。
upstream dorm_service {
    server dorm-service:8081;
    keepalive 32;
}

upstream agent_service {
    server agent-service:8082;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全头：UI 只负责静态资源与反代，不暴露内部接口
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 服务间接口绝不对外
    location ^~ /internal/ {
        return 404;
    }

    # Agent：SSE 必须关闭缓冲、拉长超时
    location ^~ /api/agent {
        proxy_pass http://agent_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        chunked_transfer_encoding on;
    }

    # 业务 API
    location ^~ /api/ {
        proxy_pass http://dorm_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 带 hash 的静态资源长缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退；带扩展名的缺失资源保持 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
