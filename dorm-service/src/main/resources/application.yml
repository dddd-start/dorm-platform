spring:
  application:
    name: dorm-service
  threads:
    virtual:
      enabled: ${DORM_VIRTUAL_THREADS:true}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DORM_DB_URL:jdbc:mysql://127.0.0.1:3307/dorm_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&useServerPrepStmts=true}
    username: ${DORM_DB_USER:dorm}
    password: ${DORM_DB_PASSWORD:}
    hikari:
      pool-name: dormHikari
      minimum-idle: 5
      maximum-pool-size: ${DORM_DB_POOL_SIZE:40}
      connection-timeout: 8000
      idle-timeout: 300000
      max-lifetime: 1500000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${DORM_REDIS_HOST:127.0.0.1}
      port: ${DORM_REDIS_PORT:6380}
      password: ${DORM_REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      connect-timeout: 3000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    table: flyway_schema_history

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${DORM_PORT:8081}
  address: 0.0.0.0
  shutdown: graceful
  lifecycle:
    timeout-per-shutdown-phase: 30s
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  tomcat:
    threads:
      max: 400
      min-spare: 20
    max-connections: 20000
    accept-count: 2000
    connection-timeout: 20s
    keep-alive-timeout: 60s

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.overseas.dorm.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      insert-strategy: not_null
      update-strategy: not_null
      where-strategy: not_null

dorm:
  internal:
    # agent-service 调用 /internal/** 时携带的服务令牌
    token: ${DORM_INTERNAL_TOKEN:dev-internal-token}
  audit:
    async: ${DORM_AUDIT_ASYNC:true}
  security:
    jwt:
      issuer: overseas-dorm
      secret: ${DORM_JWT_SECRET:dorm-dev-secret-please-override-in-production-0123456789}
      expire-minutes: 720
      refresh-expire-minutes: 10080
    login-max-fail: 5
    login-lock-minutes: 15
    phone:
      aes-key: ${DORM_PHONE_AES_KEY:}
      hmac-secret: ${DORM_PHONE_HMAC_SECRET:}

logging:
  level:
    root: INFO
    com.overseas.dorm: ${DORM_LOG_LEVEL:INFO}
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
