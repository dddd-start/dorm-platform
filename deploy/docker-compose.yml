# =============================================================================
# dorm-platform 三服务容器编排（开发/演示环境）
#
#   bash scripts/build.sh          # 先构建 UI（容器内也会构建，这里只是加速）
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://127.0.0.1:8080
#
# 说明：容器内口令是开发默认值；生产请用 secrets/KMS 覆盖，并配置 TLS。
# =============================================================================
services:
  mysql:
    image: mysql:8.4
    container_name: dorm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dorm_root_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=300
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdorm_root_password"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    container_name: dorm-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dorm_redis_password"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dorm_redis_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  dorm-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dorm
    container_name: dorm-service
    environment:
      DORM_PORT: 8081
      # 容器内必须绑 0.0.0.0：默认值已改为 127.0.0.1（防误暴露），容器网络需要显式放开
      DORM_BIND_ADDRESS: 0.0.0.0
      DORM_DB_URL: jdbc:mysql://mysql:3306/dorm_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DORM_DB_USER: dorm
      DORM_DB_PASSWORD: dorm_dev_password
      DORM_REDIS_HOST: redis
      DORM_REDIS_PORT: 6379
      DORM_REDIS_PASSWORD: dorm_redis_password
      DORM_JWT_SECRET: compose-dev-jwt-secret-change-me-0123456789
      DORM_INTERNAL_TOKEN: compose-dev-internal-token
      # 开发用固定 key（32 字节 Base64）；生产必须换成 KMS/Vault 注入
      DORM_PHONE_AES_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      DORM_PHONE_HMAC_SECRET: "compose-dev-phone-hmac-secret"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  agent-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    container_name: agent-service
    environment:
      DORM_AGENT_PORT: 8082
      # 同上：容器内需要被 ui-service 的 nginx 反代访问
      DORM_BIND_ADDRESS: 0.0.0.0
      DORM_AGENT_DB_URL: jdbc:mysql://mysql:3306/agent_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DORM_AGENT_DB_USER: agent
      DORM_AGENT_DB_PASSWORD: agent_dev_password
      DORM_REDIS_HOST: redis
      DORM_REDIS_PORT: 6379
      DORM_REDIS_PASSWORD: dorm_redis_password
      DORM_JWT_SECRET: compose-dev-jwt-secret-change-me-0123456789
      DORM_INTERNAL_TOKEN: compose-dev-internal-token
      DORM_SERVICE_URL: http://dorm-service:8081
      DORM_AI_API_KEY: ${DORM_AI_API_KEY:-}
      DORM_AGENT_MOCK: ${DORM_AGENT_MOCK:-false}
    ports:
      - "8082:8082"
    depends_on:
      dorm-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8082/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  ui-service:
    build:
      context: ../ui-service
      dockerfile: Dockerfile
    container_name: ui-service
    ports:
      - "8080:80"
    depends_on:
      dorm-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
