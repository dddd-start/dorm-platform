<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>线程时序图 · dorm-platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Design plan
     Subject: a wiring diagram for a maintenance shop. Cold steel-paper ground,
     ink-blue accent, no gradients.
     Lane colours by thread class: virtual thread = signal green,
     platform pool = amber, external system = slate, caller = indigo.
     Type: IBM Plex Sans for prose, IBM Plex Mono for thread names and code
     identifiers -- monospace keeps VT-REQ / agent-model-stream-3 aligned.
     Layout: persistent searchable index left, single-diagram reader right;
     below 860px the index stacks above the reader.
     Diagram structure: lane columns (one lane = one thread) with in-row step
     boxes. Box width = column width, so long Chinese labels wrap inside the
     box; cross-lane hops use elbow connectors with the hand-off call labelled
     on the horizontal segment. */
  --bg:#F1F4F8; --surface:#FFFFFF; --surface-2:#E8EDF4;
  --fg:#121A26; --muted:#59677A;
  --border:#D5DDE7; --border-strong:#B7C3D2;
  --accent:#1E5C99;
  --vt:#12775A; --vt-bg:#DFF1E9; --vt-line:#96CDB8;
  --pt:#8D5B0D; --pt-bg:#FAEDD6; --pt-line:#DDBB81;
  --ext:#4F6178; --ext-bg:#E6EBF1; --ext-line:#B0BDCC;
  --caller:#415580; --caller-bg:#E4E9F4; --caller-line:#ACB8D6;
  --warn:#9E3B2A;
  --shadow:0 1px 2px rgba(16,28,44,.06),0 4px 16px rgba(16,28,44,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1219; --surface:#141D27; --surface-2:#1C2734;
    --fg:#E1E8F1; --muted:#93A2B4;
    --border:#25313D; --border-strong:#344352;
    --accent:#6BA6E0;
    --vt:#4BCF98; --vt-bg:#11281F; --vt-line:#2B684C;
    --pt:#E3A845; --pt-bg:#2A2113; --pt-line:#6B5122;
    --ext:#9BAEC6; --ext-bg:#1B2530; --ext-line:#39495B;
    --caller:#93A6CE; --caller-bg:#1A2233; --caller-line:#3B4969;
    --warn:#E08A76;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1219; --surface:#141D27; --surface-2:#1C2734;
  --fg:#E1E8F1; --muted:#93A2B4;
  --border:#25313D; --border-strong:#344352;
  --accent:#6BA6E0;
  --vt:#4BCF98; --vt-bg:#11281F; --vt-line:#2B684C;
  --pt:#E3A845; --pt-bg:#2A2113; --pt-line:#6B5122;
  --ext:#9BAEC6; --ext-bg:#1B2530; --ext-line:#39495B;
  --caller:#93A6CE; --caller-bg:#1A2233; --caller-line:#3B4969;
  --warn:#E08A76;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 2.5rem; margin:0;
}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.topbar{display:flex; flex-wrap:wrap; align-items:baseline; gap:.5rem 1.25rem;
  padding-block:1.15rem .9rem; border-bottom:1px solid var(--border); margin-bottom:1.25rem}
.topbar h1{font-size:1.05rem; font-weight:600; margin:0; letter-spacing:-.01em}
.topbar .sub{font-size:.8rem; color:var(--muted)}
.topbar .spacer{flex:1 1 auto}
.themebtn{font:inherit; font-size:.75rem; padding:.3rem .7rem; cursor:pointer;
  background:var(--surface); color:var(--fg); border:1px solid var(--border-strong); border-radius:5px}
.themebtn:hover{background:var(--surface-2)}
.themebtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.legend{display:flex; flex-wrap:wrap; gap:.4rem 1.1rem; font-size:.76rem; color:var(--muted); margin-bottom:1.1rem}
.legend span{display:inline-flex; align-items:center; gap:.4rem}
.legend i{width:.62rem; height:.62rem; border-radius:2px; display:inline-block; flex:none}
.lg-vt{background:var(--vt)} .lg-pt{background:var(--pt)}
.lg-ext{background:var(--ext)} .lg-caller{background:var(--caller)}
.shell{display:grid; grid-template-columns:250px minmax(0,1fr); gap:2rem; align-items:start}
@media (max-width:860px){ .shell{grid-template-columns:minmax(0,1fr); gap:1rem} }
nav.index{position:sticky; top:1rem; max-height:calc(100vh - 2rem); overflow:auto; padding-right:.25rem}
@media (max-width:860px){ nav.index{position:static; max-height:none; padding-right:0} }
#q{width:100%; font:inherit; font-size:.82rem; padding:.45rem .6rem; margin-bottom:.7rem;
  background:var(--surface); color:var(--fg); border:1px solid var(--border-strong); border-radius:5px}
#q::placeholder{color:var(--muted)}
#q:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.grp{margin-bottom:.15rem}
.grp>button{width:100%; display:flex; align-items:center; gap:.4rem; text-align:left;
  font:inherit; font-size:.75rem; font-weight:600; color:var(--muted);
  background:none; border:0; padding:.4rem .2rem; cursor:pointer}
.grp>button:hover{color:var(--fg)}
.grp>button:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:3px}
.grp>button .chev{font-size:.6rem; transition:transform .15s}
.grp>ul{list-style:none; margin:0 0 .3rem; padding:0}
.grp>ul[hidden]{display:none!important}
.grp li>button{width:100%; display:grid; grid-template-columns:auto minmax(0,1fr); gap:.4rem;
  align-items:baseline; text-align:left; font:inherit; font-size:.78rem; line-height:1.35;
  background:none; border:0; border-left:2px solid transparent; color:var(--fg);
  padding:.3rem .35rem .3rem .45rem; cursor:pointer; border-radius:0 4px 4px 0}
.grp li>button:hover{background:var(--surface-2)}
.grp li>button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.grp li>button[aria-current="true"]{background:var(--surface); border-left-color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--border)}
.grp li>button .m{font-family:"IBM Plex Mono",monospace; font-size:.62rem; font-weight:600;
  color:var(--muted); letter-spacing:.02em; padding-top:.12rem}
.grp li>button .p{min-width:0; overflow-wrap:anywhere}
.nores{font-size:.78rem; color:var(--muted); padding:.6rem .2rem}
main{min-width:0}
header.req{border-bottom:1px solid var(--border); padding-bottom:.9rem; margin-bottom:1.1rem}
.crumb{font-size:.72rem; color:var(--muted); letter-spacing:.04em; margin-bottom:.3rem}
.method{font-family:"IBM Plex Mono",monospace; font-size:.7rem; font-weight:600;
  padding:.12rem .4rem; border-radius:3px; margin-right:.5rem; background:var(--surface-2);
  color:var(--fg); border:1px solid var(--border); vertical-align:.1em}
header.req h2{font-size:1.3rem; line-height:1.35; margin:.15rem 0 .45rem; font-weight:600;
  letter-spacing:-.012em; text-wrap:balance}
header.req .path{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--accent); overflow-wrap:anywhere}
header.req p.desc{margin:.55rem 0 0; font-size:.88rem; color:var(--muted); max-width:64ch}
.figure{margin:0 0 1.5rem}
.diagram-scroll{overflow-x:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; box-shadow:var(--shadow); padding:.4rem}
.diagram-scroll svg{display:block}
/* 宽图默认缩放到容器宽度，避免一进页面就要横向拖动；可切回 1:1 看清细节 */
.diagram-scroll.fit svg{width:100%; height:auto; max-width:100%}
.figtools{display:flex; justify-content:flex-end; gap:.4rem; margin-top:.4rem}
.figtools button{font:inherit; font-size:.72rem; padding:.22rem .55rem; cursor:pointer;
  background:var(--surface); color:var(--muted); border:1px solid var(--border-strong); border-radius:4px}
.figtools button:hover{color:var(--fg); background:var(--surface-2)}
.figtools button[aria-pressed="true"]{color:var(--accent); border-color:var(--accent)}
.figtools button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
figcaption{font-size:.78rem; color:var(--muted); margin-top:.5rem; padding-left:.15rem}
h3.sec{font-size:.74rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:1.6rem 0 .55rem; padding-bottom:.35rem; border-bottom:1px solid var(--border)}
.tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:8px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:.8rem; min-width:560px}
th,td{text-align:left; padding:.5rem .7rem; border-bottom:1px solid var(--border); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:600; background:var(--surface-2)}
td.num{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--muted);
  width:2.5rem; font-variant-numeric:tabular-nums}
td.thr{font-family:"IBM Plex Mono",monospace; font-size:.74rem; white-space:nowrap}
td.thr[data-k="vt"]{color:var(--vt)} td.thr[data-k="pt"]{color:var(--pt)}
td.thr[data-k="ext"]{color:var(--ext)} td.thr[data-k="caller"]{color:var(--caller)}
td.blk{color:var(--muted)}
td.blk b{color:var(--warn); font-weight:600}
ul.refs{list-style:none; margin:0; padding:0; font-size:.78rem}
ul.refs li{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--muted);
  padding:.28rem .15rem; border-bottom:1px dashed var(--border); overflow-wrap:anywhere}
ul.refs li:last-child{border-bottom:0}
ul.refs li b{color:var(--fg); font-weight:500}
.notes{margin:0; padding:0; list-style:none; font-size:.83rem}
.notes li{padding:.45rem 0 .45rem 1.1rem; border-bottom:1px solid var(--border); position:relative}
.notes li:last-child{border-bottom:0}
.notes li::before{content:""; position:absolute; left:.15rem; top:1rem; width:.35rem; height:.35rem;
  border-radius:50%; background:var(--accent)}
.tree{display:grid; gap:.55rem; margin-bottom:1.4rem}
.tnode{background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:.7rem .85rem; box-shadow:var(--shadow)}
.tnode>.head{display:flex; flex-wrap:wrap; align-items:baseline; gap:.5rem; margin-bottom:.35rem}
.tnode .who{font-family:"IBM Plex Mono",monospace; font-size:.8rem; font-weight:600}
.tnode .kind{font-size:.64rem; letter-spacing:.06em; text-transform:uppercase; font-weight:600;
  padding:.05rem .35rem; border-radius:3px}
.tnode .kind.vt{color:var(--vt); background:var(--vt-bg); border:1px solid var(--vt-line)}
.tnode .kind.pt{color:var(--pt); background:var(--pt-bg); border:1px solid var(--pt-line)}
.tnode .kind.ext{color:var(--ext); background:var(--ext-bg); border:1px solid var(--ext-line)}
.tnode .made{font-size:.72rem; color:var(--muted); margin-left:auto; font-family:"IBM Plex Mono",monospace}
.tnode p{margin:.15rem 0 0; font-size:.82rem; color:var(--muted)}
.tnode p code{font-size:.78rem; background:var(--surface-2); padding:.05rem .28rem; border-radius:3px; color:var(--fg)}
.hit{background:var(--pt-bg); color:inherit; box-shadow:0 0 0 2px var(--pt-line); border-radius:3px}
.pagefoot{
  margin-top:2.5rem; padding-top:1rem; border-top:1px solid var(--border);
  font-size:.76rem; color:var(--muted);
}
.pagefoot p{margin:.2rem 0; max-width:70ch}
.pagefoot a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--border-strong)}
.pagefoot a:hover{border-bottom-color:var(--accent)}
.pagefoot a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.pagefoot code{font-size:.74rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>
// ── 数据：每个接口一张图 ────────────────────────────────────────────
// lanes: 每张图的列 = 一条线程。k 决定配色（vt / pt / ext / caller）。
// steps: { n: 步骤号, lane: 列索引, text: 盒内文字, to: 跨列目标索引, hop: 跨列时横段上的说明 }
//   · 无 to  → 自消息，盒内是「组件.方法 → 下游」的直调
//   · 有 to  → 从本列盒底肘形连到目标列，hop 写在横段
// notes: 读图要点。switches: 线程切换点表。
const GROUPS = [
  { id: 'overview', title: '全局线程模型' },
  { id: 'sse',      title: 'agent · SSE 主链路' },
  { id: 'conv',     title: 'agent · 会话与消息' },
  { id: 'admin',    title: 'agent · 管理后台' },
  { id: 'region',   title: 'dorm · 区域与公寓' },
  { id: 'room',     title: 'dorm · 房间与床位' },
  { id: 'apply',    title: 'dorm · 申请与订单' },
  { id: 'stats',    title: 'dorm · 统计与审计' },
];

// 线程字典：所有图共用，保证命名与配色在 49 张图里一致
const LANES = {
  CALLER:   { name: '浏览器',            k: 'caller', sub: '前端 useAgentStream' },
  REQ:      { name: 'VT-REQ',            k: 'vt',     sub: 'Tomcat 请求线程 · 虚拟线程' },
  REQ2:     { name: 'VT-REQ (dorm)',     k: 'vt',     sub: 'dorm-service 请求线程' },
  GEN:      { name: 'VT-GEN',            k: 'vt',     sub: 'agentStreamExecutor · 虚拟线程' },
  MODEL:    { name: 'VT-MODEL',          k: 'vt',     sub: 'agent-model-stream-N · 虚拟线程' },
  SSE:      { name: 'VT-SSE',            k: 'vt',     sub: 'sse-writer-{id} · 虚拟线程' },
  AUDIT:    { name: 'VT-AUDIT',          k: 'vt',     sub: 'DormServiceClient · 虚拟线程' },
  RAGLOG:   { name: 'VT-RAGLOG',         k: 'vt',     sub: 'retrievalLogExecutor · 虚拟线程' },
  SCHED:    { name: 'VT-SCHED',          k: 'vt',     sub: 'scheduling-1 · 虚拟线程' },
  PSSE:     { name: 'PT-SSE-1..4',       k: 'pt',     sub: 'dorm-sse-* · 平台线程' },
  PPUB:     { name: 'PT-PUBSUB',         k: 'pt',     sub: 'redis-pubsub-* · 平台线程' },
  PTASK:    { name: 'PT-TASK',           k: 'pt',     sub: 'dorm-agent-task-* · 平台线程' },
  PAUDIT:   { name: 'PT-AUDIT',          k: 'pt',     sub: 'dorm-audit-* · 平台线程' },
  POUTBOX:  { name: 'PT-OUTBOX',         k: 'pt',     sub: 'dorm-outbox-* · 平台线程' },
  MYSQL:    { name: 'MySQL',             k: 'ext',    sub: 'Hikari 上限 40' },
  REDIS:    { name: 'Redis',             k: 'ext',    sub: 'Lettuce 同步命令' },
  LLM:      { name: '上游模型',           k: 'ext',    sub: 'HTTPS · 流式 SSE' },
  DORM:     { name: 'dorm-service',      k: 'ext',    sub: 'HTTP /internal/**' },
};
// ── 渲染器：把一张图定义画成 SVG ──────────────────────────────────
// 布局：n 列等宽。每步占一行。自消息 = 列内盒；跨列消息 = 列内盒 + 肘形连线
//      （从盒底竖下 → 横向到目标列中心 → 竖上到目标列在该行的位置）。
// 生命线画在列中心，被盒子压在下面，视觉上仍连续。

const LANE_W = 206;      // 列宽
const LANE_GAP = 20;     // 列间距
const PAD_X = 18, PAD_TOP = 64, PAD_BOT = 22;
const BOX_PAD = 9, LINE_H = 16, FONT = 11.5, FONT_SM = 9.5;
const ROW_GAP = 16;

const KIND_COLOR = { vt: '--vt', pt: '--pt', ext: '--ext', caller: '--caller' };
const KIND_BG   = { vt: '--vt-bg', pt: '--pt-bg', ext: '--ext-bg', caller: '--caller-bg' };
const KIND_LINE = { vt: '--vt-line', pt: '--pt-line', ext: '--ext-line', caller: '--caller-line' };

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// SVG 里没有 <b>：直接去掉标签，文字本身已经说明了重点
function stripB(s) {
  return String(s).replace(/<\/?b>/g, '');
}

// 字符宽度估算：CJK 与全角算 1em，ASCII 算 0.55em
function measure(s, fontPx) {
  let w = 0;
  for (const ch of s) {
    w += /[　-鿿＀-￯]/.test(ch) ? fontPx : fontPx * 0.55;
  }
  return w;
}

// 按字符宽度折行：显式 \n 优先，其次空格，最后仅在单 token 超宽时硬切。
function wrap(text, maxPx, fontPx) {
  const isCJK = ch => /[　-鿿＀-￯]/.test(ch);
  const out = [];
  for (const seg of String(text).split('\n')) {
    let line = '';
    let i = 0;
    while (i < seg.length) {
      // 一个 token：单个 CJK 字符，或连续的 ASCII 非空白字符，或一段空白
      let token = '';
      if (isCJK(seg[i])) {
        token = seg[i]; i++;
      } else if (/\s/.test(seg[i])) {
        while (i < seg.length && /\s/.test(seg[i])) { token += seg[i]; i++; }
      } else {
        while (i < seg.length && !isCJK(seg[i]) && !/\s/.test(seg[i])) { token += seg[i]; i++; }
      }
      if (measure(line + token, fontPx) <= maxPx) {
        line += token;
        continue;
      }
      if (line.trim()) { out.push(line.trim()); line = ''; }
      let rest = token.trim() ? token : '';
      // token 自身超宽才断行：优先在 . ( _ : , → 之后断，实在没有才硬切
      while (measure(rest, fontPx) > maxPx) {
        let cut = 1;
        while (cut < rest.length && measure(rest.slice(0, cut + 1), fontPx) <= maxPx) cut++;
        let brk = -1;
        for (let j = cut; j > Math.floor(cut * 0.45); j--) {
          if (/[.(_:,→\-\/]/.test(rest[j - 1])) { brk = j; break; }
        }
        if (brk > 0) cut = brk;
        out.push(rest.slice(0, cut));
        rest = rest.slice(cut);
      }
      line = rest;
    }
    if (line.trim()) out.push(line.trim());
  }
  return out.length ? out : [''];
}

function renderDiagram(def) {
  const lanes = def.lanes.map(l => LANES[l]);
  const n = lanes.length;
  const innerW = LANE_W - BOX_PAD * 2;
  const colX = i => PAD_X + i * (LANE_W + LANE_GAP);
  const centerX = i => colX(i) + LANE_W / 2;

  // ── 预先算每行高度 ──
  // 跨列消息走本行的竖直中点，不需要额外行间距
  const rows = def.steps.map(st => {
    const lines = wrap(stripB(st.text), innerW, FONT);
    const h = lines.length * LINE_H + 14;
    return { st, lines, h };
  });

  // 顶部标签高度固定
  const headH = 46;
  let y = PAD_TOP;
  const placed = rows.map(r => {
    const top = y;
    y += r.h + ROW_GAP;
    return { ...r, top };
  });
  const bodyBottom = y - (rows.length ? ROW_GAP : 0);
  const totalH = bodyBottom + PAD_BOT;
  // 右侧留出「切换说明」标签的半个宽度，避免最后一列的标签被 viewBox 裁掉
  const maxHopPx = Math.max(0, ...def.steps.filter(s => s.hop).map(s => measure(s.hop, FONT_SM) + 10));
  const totalW = PAD_X * 2 + n * LANE_W + (n - 1) * LANE_GAP + Math.ceil(maxHopPx / 2) + 4;

  const out = [];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalW} ${totalH}" ` +
    `width="${totalW}" height="${totalH}" role="img" aria-label="${esc(def.alt || def.title)}" ` +
    `font-family="'IBM Plex Sans','PingFang SC','Microsoft YaHei',sans-serif">`);

  // ── 生命线（列中心竖线 + 顶部标签） ──
  for (let i = 0; i < n; i++) {
    const lane = lanes[i];
    const cx = centerX(i);
    const c = `var(${KIND_COLOR[lane.k]})`;
    // 生命线
    out.push(`<line x1="${cx}" y1="${PAD_TOP - 8}" x2="${cx}" y2="${bodyBottom + 8}" ` +
      `stroke="var(${KIND_LINE[lane.k]})" stroke-width="1.5" stroke-dasharray="3 4"/>`);
    // 顶部标签：主名 + 副名
    const labelW = Math.min(LANE_W, measure(lane.name, 11.5) + 18);
    out.push(`<rect x="${cx - labelW / 2}" y="${PAD_TOP - 44}" width="${labelW}" height="21" rx="4" ` +
      `fill="var(${KIND_BG[lane.k]})" stroke="${c}" stroke-width="1"/>`);
    out.push(`<text x="${cx}" y="${PAD_TOP - 30}" text-anchor="middle" font-size="11.5" ` +
      `font-weight="600" fill="${c}" font-family="'IBM Plex Mono',monospace">${esc(lane.name)}</text>`);
    if (lane.sub) {
      out.push(`<text x="${cx}" y="${PAD_TOP - 15}" text-anchor="middle" font-size="8.5" ` +
        `fill="var(--muted)">${esc(lane.sub)}</text>`);
    }
  }

  // ── 跨列消息（先画，压在盒子下面） ──
  // 标准时序图画法：从源盒侧边水平指向目标列，箭头落在本行的竖直中点。
  // 语义只需要「哪一列 → 哪一列」，不依赖目标行，因此不会画歪。
  for (const row of placed) {
    const { st, h, top } = row;
    if (st.to == null) continue;
    const toLane = st.to;
    if (toLane === st.lane || !lanes[toLane]) continue;

    const yMid = top + h / 2;
    const srcLeft = colX(st.lane), srcRight = colX(st.lane) + LANE_W;
    const goingRight = toLane > st.lane;
    const x0 = goingRight ? srcRight : srcLeft;
    const x1 = centerX(toLane);
    const c = `var(${KIND_COLOR[lanes[toLane].k]})`;

    out.push(`<line x1="${x0}" y1="${yMid}" x2="${x1}" y2="${yMid}" ` +
      `stroke="${c}" stroke-width="1.4"/>`);
    const dir = goingRight ? 1 : -1;
    out.push(`<polygon points="${x1},${yMid} ${x1 - dir * 7},${yMid - 4} ${x1 - dir * 7},${yMid + 4}" ` +
      `fill="${c}"/>`);

    if (st.hop) {
      // 标签优先居中在「起点盒边缘 → 目标列」区间；区间放不下就贴着起点盒上沿画，
      // 位置不同而已，不省略——交接方式本身就是图上最重要的信息。
      const gapStart = goingRight ? srcRight : centerX(toLane) + 8;
      const gapEnd = goingRight ? centerX(toLane) - 8 : srcLeft;
      const lw = measure(st.hop, FONT_SM) + 10;
      const fits = gapEnd - gapStart > lw;
      const midX = fits ? (gapStart + gapEnd) / 2 : (goingRight ? srcRight + lw / 2 + 4 : srcLeft - lw / 2 - 4);
      const labelY = fits ? yMid : top + 9;
      out.push(`<rect x="${midX - lw / 2}" y="${labelY - 15}" width="${lw}" height="13" rx="3" ` +
        `fill="var(--surface)" stroke="var(--border)" stroke-width=".8"/>`);
      out.push(`<text x="${midX}" y="${labelY - 5.5}" text-anchor="middle" font-size="${FONT_SM}" ` +
        `fill="var(--muted)" font-family="'IBM Plex Mono',monospace">${esc(st.hop)}</text>`);
    }
  }

  // ── 步骤盒 ──
  for (const row of placed) {
    const { st, lines, h, top } = row;
    const i = st.lane;
    const x = colX(i);
    const lane = lanes[i];
    const c = `var(${KIND_COLOR[lane.k]})`;

    // 盒子
    out.push(`<rect x="${x}" y="${top}" width="${LANE_W}" height="${h}" rx="5" ` +
      `fill="var(${KIND_BG[lane.k]})" stroke="var(${KIND_LINE[lane.k]})" stroke-width="1"/>`);

    // 步骤号（左上角小徽标）
    out.push(`<circle cx="${x + 11}" cy="${top + 11}" r="7.5" fill="var(--surface)" ` +
      `stroke="var(${KIND_LINE[lane.k]})" stroke-width="1"/>`);
    out.push(`<text x="${x + 11}" y="${top + 14.5}" text-anchor="middle" font-size="8.5" ` +
      `font-weight="600" fill="var(--muted)" font-family="'IBM Plex Mono',monospace">${st.n}</text>`);

    // 正文
    lines.forEach((ln, k) => {
      out.push(`<text x="${x + 24}" y="${top + 15 + k * LINE_H}" font-size="${FONT}" ` +
        `fill="var(--fg)">${esc(ln)}</text>`);
    });
  }

  out.push('</svg>');
  return out.join('\n');
}

<script>
const ALL = [
  ...(typeof ENTRIES   !== 'undefined' ? ENTRIES   : []),
  ...(typeof ENTRIES_2 !== 'undefined' ? ENTRIES_2 : []),
  ...(typeof ENTRIES_3 !== 'undefined' ? ENTRIES_3 : []),

function totalCount(){ return ALL.filter(e => e.group !== 'overview').length; }

// ── 主题切换（三态：跟随系统 → 亮 → 暗 → 跟随系统） ──
(function(){
  const btn = document.getElementById('themeBtn');
  const root = document.documentElement;
  let mode = 'system';
  try { mode = localStorage.getItem('td-theme') || 'system'; } catch(e){}
  const apply = () => {
    if (mode === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    btn.textContent = mode === 'system' ? '主题：跟随系统'
      : mode === 'light' ? '主题：浅色' : '主题：深色';
  };
  apply();
  btn.addEventListener('click', () => {
    mode = mode === 'system' ? 'light' : mode === 'light' ? 'dark' : 'system';
    try { localStorage.setItem('td-theme', mode); } catch(e){}
    apply();
  });
})();

// 颜色在 CSS 变量里，SVG 用 var() 引用，主题切换自动生效，无需重绘

// ── 渲染一张图 ──
function renderEntry(ent) {
  const head = ent.method
    ? `<span class="method">${esc(ent.method)}</span>`
    : '';
  const crumb = ent.group === 'overview'
    ? '全局线程模型'
    : (ent.group === 'sse' || ent.group === 'conv' || ent.group === 'admin')
      ? 'agent-service' : 'dorm-service · /internal';

  let fig = '';
  if (ent.kind === 'tree') {
    fig = `<div class="tree">` + ent.tree.map(n => `
      <div class="tnode">
        <div class="head">
          <span class="who">${esc(n.who)}</span>
          <span class="kind ${n.kind}">${n.kind === 'vt' ? '虚拟线程' : n.kind === 'pt' ? '平台线程池' : '外部系统'}</span>
          <span class="made">${esc(n.made)}</span>
        </div>
        <p>${n.p}</p>
      </div>`).join('') + `</div>`;
  } else {
    const svg = renderDiagram(ent);
    const m = svg.match(/viewBox="0 0 (\d+) (\d+)"/);
    const wide = m && +m[1] > 900;
    fig = `<figure class="figure">
      <div class="diagram-scroll${wide ? ' fit' : ''}">${svg}</div>
      <div class="figtools">
        <button type="button" class="fitbtn" aria-pressed="${wide ? 'true' : 'false'}">${
          wide ? '适配宽度' : '原始大小'}</button>
      </div>
      <figcaption>${esc(ent.alt || '')}</figcaption>
    </figure>`;
  }

  const sw = (ent.switches && ent.switches.length) ? `
    <h3 class="sec">线程切换点</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>步骤</th><th>切换</th><th>触发方式</th><th>为什么</th></tr></thead>
      <tbody>${ent.switches.map(s => `
        <tr>
          <td class="num">${s.n}</td>
          <td class="thr">${esc(s.lane)}</td>
          <td class="blk"><span class="mono">${esc(s.how)}</span></td>
          <td class="blk">${esc(s.why)}</td>
        </tr>`).join('')}</tbody>
    </table></div>` : '';

  const refs = ent.refs && ent.refs.length ? `
    <h3 class="sec">关键代码</h3>
    <ul class="refs">${ent.refs.map(r => `<li><b>${esc(r[0])}</b> — ${esc(r[1])}</li>`).join('')}</ul>` : '';

  const notes = ent.notes && ent.notes.length ? `
    <h3 class="sec">读图要点</h3>
    <ul class="notes">${ent.notes.map(n => `<li>${n}</li>`).join('')}</ul>` : '';

  return `
    <header class="req">
      <div class="crumb">${esc(crumb)}</div>
      <h2>${head}${esc(ent.title)}</h2>
      <div class="path">${esc(ent.path)}</div>
      <p class="desc">${esc(ent.desc)}</p>
    </header>
    ${fig}
    ${sw}${refs}${notes}`;
}

// ── 索引 ──
let currentId = null;
const rendered = new Map();   // id → 已渲染的 HTML 片段，切回时复用

function buildNav(filter) {
  const f = (filter || '').trim().toLowerCase();
  const list = document.getElementById('navList');
  const noRes = document.getElementById('noRes');
  const frag = [];
  let shown = 0;

  for (const g of GROUPS) {
    const items = ALL.filter(e => e.group === g.id);
    if (!items.length) continue;
    const matched = !f ? items : items.filter(e =>
      (e.path + ' ' + e.title + ' ' + (e.method || '') + ' ' +
       (e.desc || '') + ' ' + (e.lanes || []).join(' ')).toLowerCase().includes(f));
    if (!matched.length) continue;
    shown += matched.length;
    frag.push(`<div class="grp">
      <button type="button" aria-expanded="true" data-grp="${g.id}">
        <span class="chev">▾</span><span>${esc(g.title)}</span>
        <span style="margin-left:auto;font-weight:400;opacity:.6">${matched.length}</span>
      </button>
      <ul>` + matched.map(e => `
        <li><button type="button" data-id="${e.id}" ${e.id === currentId ? 'aria-current="true"' : ''}>
          <span class="m">${esc(e.method || '·')}</span>
          <span class="p">${esc(e.title)}</span>
        </button></li>`).join('') + `</ul>
    </div>`);
  }
  list.innerHTML = frag.join('');
  noRes.hidden = shown > 0;

  // 分组折叠
  list.querySelectorAll('.grp > button').forEach(btn => {
    btn.addEventListener('click', () => {
      const ul = btn.nextElementSibling;
      const open = ul.hidden;
      ul.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      btn.querySelector('.chev').textContent = open ? '▾' : '▸';
    });
  });
  // 选中
  list.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', () => select(btn.dataset.id));
  });
}

function select(id) {
  const ent = ALL.find(e => e.id === id);
  if (!ent) return;
  currentId = id;
  const reader = document.getElementById('reader');
  if (!rendered.has(id)) rendered.set(id, renderEntry(ent));
  reader.innerHTML = rendered.get(id);
  // 缩放开关：宽图默认适配容器，点击切回 1:1
  const fb = reader.querySelector('.fitbtn');
  if (fb) {
    fb.addEventListener('click', () => {
      const box = fb.closest('figure').querySelector('.diagram-scroll');
      const on = box.classList.toggle('fit');
      fb.setAttribute('aria-pressed', String(on));
      fb.textContent = on ? '适配宽度' : '原始大小';
    });
  }
  // 高亮
  document.querySelectorAll('#navList button[data-id]').forEach(b => {
    if (b.dataset.id === id) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
  });
  // 图注里的「选区」没有额外逻辑
  if (window.matchMedia('(max-width:860px)').matches) {
    reader.scrollIntoView({ block: 'start', behavior: 'smooth' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  try { history.replaceState(null, '', '#' + id); } catch(e){}
}

// 搜索
let searchTimer = null;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => buildNav(v), 90);
});

// 初始
buildNav('');
const fromHash = (location.hash || '').slice(1);
select(fromHash && ALL.some(e => e.id === fromHash) ? fromHash : 'overview-turn');

// 计数写进副标题
document.addEventListener('DOMContentLoaded', () => {
  const sub = document.querySelector('.topbar .sub');
  if (sub) sub.textContent = `dorm-platform · ${totalCount()} 个接口，每一步标出由哪条线程执行`;
});
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').slice(1);
  if (h && h !== currentId && ALL.some(e => e.id === h)) select(h);
});
</script>
